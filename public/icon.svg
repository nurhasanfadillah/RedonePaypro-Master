<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- RP Monogram -->
  <g transform="translate(256,256)" fill="none" stroke="#22c55e" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- R: vertical stroke -->
    <path d="M-100,-110 L-100,110"/>
    <!-- R: top curve -->
    <path d="M-100,-110 Q-20,-110 0,-80 Q20,-50 0,-20"/>
    <!-- R: diagonal leg -->
    <path d="M-45,-20 L60,110"/>
    <!-- P: vertical stroke -->
    <path d="M80,-110 L80,110"/>
    <!-- P: top curve -->
    <path d="M80,-110 Q170,-110 170,-55 Q170,0 80,0"/>
  </g>
</svg>
